notes: >-
  CallMiner publishes no rate-limit documentation. There is no public developer
  portal (developer.callminer.com and docs.callminer.com are NXDOMAIN), the
  Swagger UIs on api.callminer.net 302 to an interactive login, and no
  anonymously reachable CallMiner page states a quota, a window, or a
  rate-limit response header. Nothing was observed on the wire either: every
  anonymous request to the API host is redirected to the identity provider
  before any RateLimit-* or Retry-After header could be emitted. limit_count: 0
  is a measured absence, not an unchecked field.

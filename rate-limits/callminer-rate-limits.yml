exhaustion_status: unknown
throttling_evidence:
- source: https://github.com/Matatika/tap-callminer
  kind: third-party-client
  observation: >-
    The maintained open-source Singer tap for the Bulk Export API mounts a
    transport-level urllib3 Retry(total=3, backoff_factor=1) on idempotent
    methods only, and leaves status-based retry to the Singer SDK's default
    backoff. Its code comments attribute retries to long-lived idle connections
    during multi-hour export downloads rather than to server-side throttling —
    so there is no third-party evidence of a published or observed rate limit
    either. Recorded as ecosystem context, not as a CallMiner statement.
practical_limits:
  note: >-
    The Bulk Export API is job-based rather than request-rate-based: a client
    POSTs an export job and polls job history at 60-second intervals until the
    execution completes. The effective constraint is export job execution time
    and concurrency, neither of which CallMiner documents publicly.

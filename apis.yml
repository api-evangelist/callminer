aid: callminer
name: CallMiner
description: 'CallMiner is a Waltham, Massachusetts conversation intelligence and contact-center
  analytics company whose Eureka platform captures and analyzes omnichannel customer
  interactions — recorded and real-time audio, screen recordings, chat, email, surveys
  and video — to surface customer experience, quality management, risk and compliance,
  fraud and sales-effectiveness insight. The product family spans Capture (Record,
  Screen Record, Redact), Intelligence (Analyze, Visualize), Augmentation (Coach, RealTime)
  and Automation (Outreach, OmniAgent, LiveTranslate). CallMiner exposes an OAuth 2.0
  protected developer API — a media/metadata Ingestion API and a Bulk Export API — hosted
  on regional api*.callminer.net endpoints and secured by its own IdentityServer-based
  identity provider at idp*.callminer.net. The API reference is published as Swagger
  UI on the API host itself but sits behind an interactive login, so no machine-readable
  contract is publicly retrievable.'

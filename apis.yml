apis:
- name: CallMiner Eureka Ingestion API
  description: 'Asynchronously add or update media and metadata for audio and text-based
    contacts in a CallMiner Eureka tenant. Hosted on the regional CallMiner API host
    and protected by OAuth 2.0 client credentials issued against the CallMiner identity
    provider; the Swagger UI on the API host requires an interactive CallMiner login,
    so the OpenAPI document is not publicly retrievable.'
  humanURL: https://api.callminer.net/swagger
  baseURL: https://api.callminer.net
  tags:
  - Ingestion
  - Media
  - Metadata
  x-access: gated
  x-evidence:
    fetched: '2026-08-09'
    swagger_ui: https://api.callminer.net/swagger
    http_status: 302
    redirects_to: https://idp.callminer.net/connect/authorize
    oauth_scope: https://callminer.net/auth/platform-ingestion
  properties:
  - type: Authentication
    url: authentication/callminer-authentication.yml
  - type: OAuthScopes
    url: scopes/callminer-scopes.yml
- name: CallMiner Eureka Bulk Export API
  description: 'Create and poll bulk export jobs that extract contact, transcript,
    score and metadata datasets out of a CallMiner Eureka tenant as downloadable archives.
    Protected by OAuth 2.0 client credentials against the CallMiner identity provider;
    the Swagger UI is served from the API host but redirects to an interactive login.'
  humanURL: https://api.callminer.net/bulkexport/swagger
  baseURL: https://api.callminer.net/bulkexport/api
  tags:
